<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TravelMate AngularJS Admin</title><style>body{font-family:Arial;background:#f6f7f3;margin:0;color:#263238}.wrap{max-width:1000px;margin:35px auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid #dce3df;border-radius:14px;padding:18px;box-shadow:0 8px 20px rgba(0,0,0,.06)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e2e8e5;text-align:left}button,input{padding:8px;border:1px solid #ccd7d2;border-radius:8px}button{cursor:pointer;background:#2f7d69;color:white;border:0}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr}}</style></head>
<body ng-app="travelAdmin" ng-controller="AdminCtrl"><div class="wrap"><h1>TravelMate Admin Dashboard</h1><p>Simple AngularJS module for the Web Technologies lab.</p><div class="cards"><div class="card"><strong style="font-size:28px">{{stats.users}}</strong><br>Users</div><div class="card"><strong style="font-size:28px">{{stats.trips}}</strong><br>Trips</div><div class="card"><strong style="font-size:28px">{{stats.destinations}}</strong><br>Destinations</div><div class="card"><strong style="font-size:28px">{{stats.feedback}}</strong><br>Feedback</div></div><div class="panel" style="margin-top:18px"><h2>Destinations</h2><input ng-model="search" placeholder="Filter destinations"><table class="table"><tr><th>Name</th><th>Category</th><th>Rating</th></tr><tr ng-repeat="d in destinations | filter:search"><td>{{d.name}}</td><td>{{d.category}}</td><td>{{d.rating}}</td></tr></table></div></div>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script><script>angular.module('travelAdmin',[]).controller('AdminCtrl',function($scope){$scope.stats={users:24,trips:37,destinations:9,feedback:6};$scope.destinations=[{name:'Ooty',category:'Hill Station',rating:4.7},{name:'Kodaikanal',category:'Hill Station',rating:4.6},{name:'Munnar',category:'Nature',rating:4.8},{name:'Coorg',category:'Adventure',rating:4.7},{name:'Chennai',category:'Beach',rating:4.4},{name:'Madurai',category:'Historical',rating:4.6},{name:'Mysuru',category:'Historical',rating:4.7},{name:'Kochi',category:'Food',rating:4.5},{name:'Bandipur',category:'Wildlife',rating:4.6}];});</script></body></html>
